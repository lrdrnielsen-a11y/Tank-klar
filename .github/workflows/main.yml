name: Opdater priser

on:
  schedule:
    # Skæve minuttal: GitHub forsinker ofte kørsler, der ligger på hele klokkeslæt.
    - cron: "23 17 * * *"   # aften: prognose, elpriser, alarmer og stationspriser (18:23 vinter / 19:23 sommer)
    - cron: "7 6 * * *"     # morgen
    - cron: "17 9,10 * * *" # lige efter kædernes prisændring kl. 11 (sommer- og vintertid)
    - cron: "37 12,14 * * *" # eftermiddag
  workflow_dispatch:        # knappen "Run workflow" – og det eksterne vækkeur (cron-job.org)
    inputs:
      koersel:
        description: "dag = kun priser og prognose, aften = også prisalarmer"
        default: "aften"
      alarmer:
        description: "ja = send prisalarmer (kun aftenkørslen)"
        default: "nej"

permissions:
  contents: write

jobs:
  opdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent priser og beregn prognose
        env:
          KOERSEL: ${{ github.event_name == 'workflow_dispatch' && inputs.koersel || (github.event_name == 'schedule' && github.event.schedule != '23 17 * * *' && 'dag' || 'aften') }}
          ALARMER: ${{ github.event_name == 'workflow_dispatch' && inputs.alarmer || 'nej' }}
        run: python scripts/update.py

      - name: Gem de nye data (Cloudflare henter dem selv)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Opdater priser $(date -u +%F\ %H:%M)"
          git pull --rebase --quiet || true
          git push
