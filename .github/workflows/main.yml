name: Opdater priser

on:
  schedule:
    - cron: "30 17 * * *"   # hver aften: prognose, elpriser, alarmer og stationspriser
    - cron: "0 6 * * *"     # morgen
    - cron: "15 9,10 * * *" # lige efter kædernes prisændring kl. 11 (sommer- og vintertid)
    - cron: "0 13,15 * * *" # eftermiddag
  workflow_dispatch:        # giver knappen "Run workflow"

permissions:
  contents: write

jobs:
  opdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent priser og beregn prognose
        env:
          KOERSEL: ${{ github.event_name == 'schedule' && github.event.schedule != '30 17 * * *' && 'dag' || 'aften' }}
        run: python scripts/update.py

      - name: Gem de nye data (Cloudflare henter dem selv)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Opdater priser $(date -u +%F\ %H:%M)"
          git pull --rebase --quiet || true
          git push
